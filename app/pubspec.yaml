name: pegou_preco
description: PegouPreço — app offline-first de preços e compras (MVP).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.3
  http: ^1.3.0
  html: ^0.15.5
  google_mlkit_text_recognition: ^0.14.0
  mobile_scanner: ^6.0.7
  camera: ^0.11.1
  permission_handler: ^11.4.0
  intl: ^0.20.2
  uuid: ^4.5.1
  collection: ^1.19.0
  equatable: ^2.0.7
  google_fonts: ^6.2.1
  lucide_icons_flutter: ^3.1.20
  flutter_animate: ^4.5.2
  gap: ^3.0.1
  shimmer: ^3.0.0
  fl_chart: ^0.70.2
  shared_preferences: ^2.5.3
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  isar_generator: ^3.1.0+1
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/branding/logo.png
    - assets/branding/app_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#FFD400"
  adaptive_icon_foreground: assets/branding/app_icon.png
  remove_alpha_ios: true
  min_sdk_android: 24
